[manifest]
version = "0.1.0"
priority = 0


## Joker cardarea hand size counter


[[patches]]
[patches.pattern]
target = 'cardarea.lua'
pattern = '''
self.children.area_uibox = UIBox{
'''
position = "before"
payload = '''
if G.GAME.selected_back.effect.center.key == 'b_nancy_crumpled' and self == G.jokers then
    card_count = not self.config.no_card_count and self ~= G.shop_vouchers and {n=G.UIT.R, config={align = self == G.jokers and 'cl' or self == G.hand and 'cm' or 'cr', padding = 0.03, no_fill = true}, nodes={
        {n=G.UIT.B, config={w = 0.1,h=0.1}},
        {n=G.UIT.T, config={text = 'Hand size: ', scale = 0.3, colour = G.C.WHITE}},
        {n=G.UIT.T, config={ref_table = G.GAME, ref_value = 'nancy_crumpledslots', scale = 0.3, colour = G.C.WHITE}},
        {n=G.UIT.B, config={w = 0.1,h=0.1}}
    }} or nil
end
'''
match_indent = true


## Riff-raff compat


[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = '''
if self.ability.name == 'Riff-raff' and not (context.blueprint_card or self).getting_sliced and #G.jokers.cards + G.GAME.joker_buffer < G.jokers.config.card_limit then
'''
position = "at"
payload = '''
if self.ability.name == 'Riff-raff' and not (context.blueprint_card or self).getting_sliced and ((#G.jokers.cards + G.GAME.joker_buffer < G.jokers.config.card_limit) or G.GAME.selected_back.effect.center.key == 'b_nancy_crumpled') then
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = '''
local jokers_to_create = math.min(2, G.jokers.config.card_limit - (#G.jokers.cards + G.GAME.joker_buffer))
'''
position = "after"
payload = '''
if G.GAME.selected_back.effect.center.key == 'b_nancy_crumpled' then jokers_to_create = 2 end
'''
match_indent = true


## Top-up tag compat


[[patches]]
[patches.pattern]
target = 'tag.lua'
pattern = '''
if G.jokers and #G.jokers.cards < G.jokers.config.card_limit then
''' 
position = "at"
payload = '''
if (G.jokers and #G.jokers.cards < G.jokers.config.card_limit) or G.GAME.selected_back.effect.center.key == 'b_nancy_crumpled' then
'''
match_indent = true