[manifest]
version = "0.1.0"
priority = 0


## Stop DNA from copying Negative


[[patches]]
[patches.pattern]
target = 'functions/common_events.lua'
pattern = '''
elseif _c.name == 'Midas Mask' then info_queue[#info_queue+1] = G.P_CENTERS.m_gold
'''
position = "after"
payload = '''
elseif _c.name == 'DNA' then
    for _, _card in ipairs(G.playing_cards or {}) do
        if _card.edition and _card.edition.key == "e_negative" then
            info_queue[#info_queue + 1] = { key = 'e_negative_playing_card', set = 'Edition', config = { extra = 1 } }
            main_end = {}
            localize{ type = 'other', key = 'remove_negative', nodes = main_end, vars = {} }
            main_end = main_end[1]
            break
        end
    end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = '''
local _card = copy_card(context.full_hand[1], nil, nil, G.playing_card)
'''
position = "after"
payload = '''
if _card.edition and _card.edition.key == "e_negative" then
    _card:set_edition(nil, true, true)
end
'''
match_indent = true


## Stop Death from copying Negative


[[patches]]
[patches.pattern]
target = 'functions/common_events.lua'
pattern = '''
elseif _c.name == "Death" then loc_vars = {cfg.max_highlighted}
'''
position = "at"
payload = '''
elseif _c.name == "Death" then
    for _, _card in ipairs(G.playing_cards or {}) do
        if _card.edition and _card.edition.key == "e_negative" then
            info_queue[#info_queue + 1] = { key = 'e_negative_playing_card', set = 'Edition', config = { extra = 1 } }
            main_end = {}
            localize{ type = 'other', key = 'remove_negative', nodes = main_end, vars = {} }
            main_end = main_end[1]
            break
        end
    end
loc_vars = {cfg.max_highlighted}
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = '''
copy_card(rightmost, G.hand.highlighted[i])
'''
position = "after"
payload = '''
if G.hand.highlighted[i].edition and G.hand.highlighted[i].edition.key == "e_negative" then
    G.hand.highlighted[i]:set_edition(nil, true, true)
end
'''
match_indent = true


